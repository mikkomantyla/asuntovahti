name: Crawl Oikotie

on:
  schedule:
    - cron: '17 3 * * *' # daily, around 06:17 Finnish time
  workflow_dispatch:

permissions:
  contents: write

concurrency: crawl

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node crawler/crawl.mjs
      - name: Commit updated listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update listings"
          git push
